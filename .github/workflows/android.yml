name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Prepare web files
        run: |
          mkdir -p www assets
          cp index.html manifest.webmanifest icon-*.png www/
          [ -f assets/icon-only.png ] || cp icon-maskable-512.png assets/icon-only.png

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: App icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#24272d' --iconBackgroundColorDark '#24272d' || echo "icon generation skipped"

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PDF-Measure.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Measure-apk
          path: PDF-Measure.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest PDF-Measure.apk --title "PDF Measure (ล่าสุด)" --notes "ดาวน์โหลด PDF-Measure.apk แล้วติดตั้งบน Android" --latest
